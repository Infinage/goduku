<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Goduku</title>
    <link href="index.css" rel="stylesheet" />
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        input[type="text"] { -webkit-appearance: none; border-radius: 0; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
        }
        .animate-shake { animation: shake 0.4s; }

        @keyframes tracking-in-expand {
            0% {
                letter-spacing: -0.5em;
                opacity: 0;
            }
            40% {
                opacity: 0.6;
            }
            100% {
                letter-spacing: 0.4em; /* match your final spacing */
                opacity: 1;
            }
        }

        .animate-logo {
            animation: tracking-in-expand 0.7s cubic-bezier(0.215,0.610,0.355,1) both;
        }
    </style>
</head>
<body class="bg-[#121214] text-[#e0e0e0] flex flex-col items-center min-h-screen p-2 sm:p-4 overflow-x-hidden font-sans" x-data="sudokuApp()">
    
    <h1 class="animate-logo text-4xl md:text-6xl font-black mt-2 mb-4 md:mb-6 text-center uppercase tracking-[0.4em] bg-gradient-to-b from-white to-[#4a9eff] bg-clip-text text-transparent drop-shadow-[0_0_10px_rgba(74,158,255,0.3)] cursor-pointer hover:opacity-80 transition-opacity" @click="hardReset()">
        GODUKU
    </h1>

    <div 
        class="relative grid grid-cols-9 gap-[1px] w-full max-w-[500px] bg-[#333] border-4 border-[#555] shadow-[0_20px_50px_rgba(0,0,0,0.5)] mb-4 touch-manipulation"
        :class="{ 'animate-shake': isShaking }"
        @animationend="isShaking = false"
    >
        <div class="absolute top-0 bottom-0 left-1/3 -translate-x-1/2 w-[2px] bg-[#555] pointer-events-none z-[5]"></div>
        <div class="absolute top-0 bottom-0 left-2/3 -translate-x-1/2 w-[2px] bg-[#555] pointer-events-none z-[5]"></div>
        <div class="absolute left-0 right-0 top-1/3 -translate-y-1/2 h-[2px] bg-[#555] pointer-events-none z-[5]"></div>
        <div class="absolute left-0 right-0 top-2/3 -translate-y-1/2 h-[2px] bg-[#555] pointer-events-none z-[5]"></div>

        <template x-for="(val, index) in board" :key="index">
            <input
                type="text"
                inputmode="none"
                :id="'cell-' + index"
                class="w-full aspect-square p-0 m-0 text-center text-lg md:text-2xl bg-[#1e1e22] outline-none focus:bg-[#2a2a30] focus:ring-2 focus:ring-inset focus:ring-[#4a9eff] focus:z-10 transition-colors rounded-none disabled:bg-[#16161a] disabled:text-[#4a9eff] disabled:font-bold border-0"
                :class="{
                    'bg-[#442222] text-[#ffaaaa]': invalidCells.includes(index),
                    'bg-[#25252b]': isContextHighlighted(index)
                }"
                x-model="board[index]"
                :disabled="lockedCells.includes(index)"
                @focus="activeCell = index"
                @blur="activeCell = null"
                @input="handleInput($event, index)"
                @keydown="handleKeydown($event, index)"
            >
        </template>
    </div>

    <div class="flex flex-wrap justify-center gap-2 w-full max-w-[500px] mb-4">
        <button class="flex-1 min-w-[90px] py-2 px-4 border border-[#333] bg-[#1e1e22] rounded-md font-semibold text-sm hover:bg-[#2a2a30] hover:border-[#4a9eff] disabled:opacity-20 disabled:cursor-not-allowed transition-all" :disabled="!wasmReady" @click="generate()">GENERATE</button>
        <button class="flex-1 min-w-[90px] py-2 px-4 border border-[#333] bg-[#1e1e22] rounded-md font-semibold text-sm hover:bg-[#2a2a30] hover:border-[#4a9eff] disabled:opacity-20 disabled:cursor-not-allowed transition-all" :disabled="!wasmReady" @click="solve()">SOLVE</button>
        <button class="flex-1 min-w-[90px] py-2 px-4 border border-[#333] bg-[#1e1e22] rounded-md font-semibold text-sm hover:bg-[#2a2a30] hover:border-[#4a9eff] transition-all" @click="clear()">CLEAR</button>
    </div>

    <div class="flex justify-center gap-1 sm:gap-2 w-full max-w-[500px]">
        <template x-for="key in [1, 2, 3, 4, 5, 6, 7, 8, 9, '⌫']">
            <button
                class="flex-1 aspect-square max-w-[50px] border border-[#333] bg-[#1e1e22] rounded-md font-semibold text-base sm:text-lg hover:bg-[#2a2a30] hover:border-[#4a9eff] disabled:opacity-20 disabled:cursor-not-allowed transition-all flex items-center justify-center"
                :disabled="activeCell === null || lockedCells.includes(activeCell)"
                @mousedown.prevent="inputNumber(key)"
            >
                <span x-text="key"></span>
            </button>
        </template>
    </div>

    <div 
        class="fixed bottom-6 left-1/2 transform -translate-x-1/2 min-w-[250px] px-4 py-3 rounded-lg text-center font-semibold text-white z-50 transition-all duration-300 ease-out"
        :class="[
            toast.show ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4 pointer-events-none',
            toast.type === 'error' ? 'bg-[#ff4a4a] shadow-[0_0_20px_rgba(255,74,74,0.4)]' : 'bg-[#4a9eff] shadow-[0_0_20px_rgba(74,158,255,0.4)]'
        ]"
        x-text="toast.message"
    ></div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('sudokuApp', () => ({
                isDesktop: false,
                wasmReady: false,
                board: Array(81).fill(''),
                lockedCells: [],
                activeCell: null,
                invalidCells: [],
                isShaking: false,
                validateTimer: null,
                toast: { show: false, message: '', type: 'success', timeout: null },

                init() {
                    window.addEventListener("paste", (e) => {
                        const text = e.clipboardData.getData("text");
                        const vals = text.match(/[0-9.]/g);
                        if (vals && vals.length === 81) {
                            e.preventDefault();
                            this.setCSV(text);
                            this.showToast("Board Pasted");
                        }
                    });

                    window.addEventListener("copy", (e) => {
                        e.preventDefault();
                        const csv = this.getCSV();
                        if (e.clipboardData) {
                            e.clipboardData.setData("text/plain", csv);
                            this.showToast("Copied board state");
                        } else if (navigator.clipboard) {
                            navigator.clipboard.writeText(csv).then(() => {
                                this.showToast("Copied board state");
                            }).catch(err => console.error("Clipboard copy failed:", err));
                        }
                    });

                    if (this.isDesktop) {
                        console.log("Running in Desktop Mode (WebUI)");
                        this.wasmReady = true;
                    } else {
                        const script = document.createElement('script');
                        script.src = 'wasm_exec.js';
                        script.onload = () => {
                            if (typeof Go !== 'undefined') {
                                const go = new Go();
                                WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject)
                                .then((result) => {
                                    go.run(result.instance);
                                    this.wasmReady = true;
                                    console.log("Running in Browser Mode (WASM)");
                                }).catch(e => console.warn("WASM load failed, ignoring if testing UI:", e));
                            }
                        };
                        document.head.appendChild(script);
                    }
                },

                async callBackend(funcName, arg) {
                    if (this.isDesktop) {
                        const raw = await window[funcName](arg);
                        return typeof raw === "string" ? JSON.parse(raw) : raw;
                    } else if (typeof window[funcName] === 'function') {
                        return window[funcName](arg);
                    }
                    console.warn(`Backend function ${funcName} not found.`);
                    return null;
                },

                showToast(message, type = "success") {
                    if (this.toast.timeout) clearTimeout(this.toast.timeout);
                    this.toast = { show: true, message, type, timeout: null };
                    this.toast.timeout = setTimeout(() => {
                        this.toast.show = false;
                    }, 1900);
                },

                getCSV() {
                    return this.board.map(v => v || "0").join(",");
                },

                setCSV(csv) {
                    const vals = csv.match(/[0-9.]/g);
                    if (!vals || vals.length !== 81) return this.showToast("Invalid board", "error");
                    
                    this.lockedCells = [];
                    for (let i = 0; i < 81; i++) {
                        const v = vals[i];
                        if (v === "0" || v === ".") {
                            this.board[i] = "";
                        } else {
                            this.board[i] = v;
                            this.lockedCells.push(i);
                        }
                    }
                    this.validateBoard();
                },

                inputNumber(key) {
                    if (this.activeCell !== null && !this.lockedCells.includes(this.activeCell)) {
                        this.board[this.activeCell] = key === '⌫' ? "" : key.toString();
                        this.debouncedValidate();
                        setTimeout(() => this.checkCompletion(), 50);
                        document.getElementById('cell-' + this.activeCell)?.focus();
                    }
                },

                handleInput(e, index) {
                    const val = e.target.value.replace(/[^1-9]/g, "");
                    this.board[index] = val.slice(-1);
                    this.debouncedValidate();
                    setTimeout(() => this.checkCompletion(), 50);
                },

                handleKeydown(e, index) {
                    const key = e.key.toLowerCase();
                    
                    if (key === "escape") {
                        document.activeElement.blur();
                        return;
                    }

                    const navKeys = ["arrowright", "arrowleft", "arrowdown", "arrowup", "h", "j", "k", "l"];
                    if (navKeys.includes(key)) {
                        e.preventDefault();
                        const row = Math.floor(index / 9);
                        const col = index % 9;
                        let targetIdx = index;

                        if (key === "arrowright" || key === "l") targetIdx = this.move(row, col, 0, 1);
                        else if (key === "arrowleft" || key === "h") targetIdx = this.move(row, col, 0, -1);
                        else if (key === "arrowdown" || key === "j") targetIdx = this.move(row, col, 1, 0);
                        else if (key === "arrowup" || key === "k") targetIdx = this.move(row, col, -1, 0);

                        if (targetIdx !== index) {
                            document.getElementById('cell-' + targetIdx)?.focus();
                        }
                        return;
                    }

                    if ((key === "backspace" || key === "delete") && !this.lockedCells.includes(index)) {
                        e.preventDefault();
                        this.board[index] = "";
                        this.debouncedValidate();
                    }
                },

                move(row, col, dr, dc) {
                    let r = row, c = col;
                    while (true) {
                        r += dr; c += dc;
                        if (r < 0 || r >= 9 || c < 0 || c >= 9) return (row * 9 + col);
                        const nextIdx = r * 9 + c;
                        if (!this.lockedCells.includes(nextIdx)) return nextIdx;
                    }
                },

                isContextHighlighted(index) {
                    if (this.activeCell === null || this.activeCell === index) return false;
                    const activeRow = Math.floor(this.activeCell / 9);
                    const activeCol = this.activeCell % 9;
                    const row = Math.floor(index / 9);
                    const col = index % 9;
                    const gridRow = Math.floor(activeRow / 3) * 3;
                    const gridCol = Math.floor(activeCol / 3) * 3;
                    return (row === activeRow || col === activeCol || (row >= gridRow && row < gridRow + 3 && col >= gridCol && col < gridCol + 3));
                },

                debouncedValidate() {
                    clearTimeout(this.validateTimer);
                    this.validateTimer = setTimeout(() => this.validateBoard(), 100);
                },

                async validateBoard() {
                    const res = await this.callBackend("validate", this.getCSV());
                    if (!res) return;
                    
                    this.invalidCells = [];
                    if (res.success && res.data) {
                        this.invalidCells = res.data.map(({row, col}) => row * 9 + col);
                    }
                    return res;
                },

                checkCompletion() {
                    if (this.board.every(c => c !== "")) {
                        this.validateBoard().then(() => {
                            if (this.invalidCells.length === 0) this.triggerWin();
                            else { 
                                this.showToast("Errors remain!", "error"); 
                                this.isShaking = true; 
                            }
                        });
                    }
                },

                triggerWin() {
                    this.showToast("Congrats!");
                    const end = Date.now() + 3000;
                    (function frame() {
                        confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 } });
                        confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 } });
                        if (Date.now() < end) requestAnimationFrame(frame);
                    }());
                },

                async generate() {
                    const res = await this.callBackend("generate", "");
                    if (res && res.success) this.setCSV(res.data);
                },

                async solve() {
                    const res = await this.callBackend("solve", this.getCSV());
                    if (res && res.success && res.data) {
                        const vals = Array.from(res.data.replace(/[^1-9]/g, ""));
                        for (let i = 0; i < 81; i++) {
                            if (!this.board[i]) this.board[i] = vals[i];
                        }
                        this.validateBoard();
                        this.showToast("Solved!");
                    } else {
                        this.showToast(res?.error || "Unsolvable!", "error");
                        this.isShaking = true;
                    }
                },

                clear() {
                    for (let i = 0; i < 81; i++) {
                        if (!this.lockedCells.includes(i)) {
                            this.board[i] = "";
                        }
                    }
                    this.invalidCells = [];
                    this.showToast("Grid Cleared");
                },

                hardReset() {
                    this.board = Array(81).fill('');
                    this.lockedCells = [];
                    this.invalidCells = [];
                    this.validateBoard();
                    this.showToast("System Hard Reset");
                    this.isShaking = true;
                }
            }))
        })
    </script>
</body>
</html>
